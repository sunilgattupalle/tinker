<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Body -->
  <ellipse cx="24" cy="30" rx="14" ry="12" fill="#FFAB19" stroke="#E69500" stroke-width="1.5"/>
  <!-- Head -->
  <circle cx="24" cy="16" r="10" fill="#FFAB19" stroke="#E69500" stroke-width="1.5"/>
  <!-- Ears -->
  <polygon points="16,8 12,2 20,6" fill="#FFAB19" stroke="#E69500" stroke-width="1"/>
  <polygon points="32,8 36,2 28,6" fill="#FFAB19" stroke="#E69500" stroke-width="1"/>
  <!-- Ear insides -->
  <polygon points="16.5,8 13.5,3.5 19.5,6.5" fill="#FF8C1A"/>
  <polygon points="31.5,8 34.5,3.5 28.5,6.5" fill="#FF8C1A"/>
  <!-- Eyes -->
  <ellipse cx="20" cy="15" rx="2.5" ry="3" fill="white"/>
  <ellipse cx="28" cy="15" rx="2.5" ry="3" fill="white"/>
  <circle cx="20.5" cy="15.5" r="1.5" fill="#2D2D2D"/>
  <circle cx="28.5" cy="15.5" r="1.5" fill="#2D2D2D"/>
  <!-- Nose -->
  <ellipse cx="24" cy="19" rx="1.5" ry="1" fill="#FF6B6B"/>
  <!-- Mouth -->
  <path d="M22,20.5 Q24,22.5 26,20.5" fill="none" stroke="#E69500" stroke-width="1" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="10" y1="17" x2="18" y2="18" stroke="#E69500" stroke-width="0.8"/>
  <line x1="10" y1="20" x2="18" y2="20" stroke="#E69500" stroke-width="0.8"/>
  <line x1="38" y1="17" x2="30" y2="18" stroke="#E69500" stroke-width="0.8"/>
  <line x1="38" y1="20" x2="30" y2="20" stroke="#E69500" stroke-width="0.8"/>
  <!-- Tail -->
  <path d="M38,32 Q44,28 42,22" fill="none" stroke="#E69500" stroke-width="2.5" stroke-linecap="round"/>
</svg>
